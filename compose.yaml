name: matcha

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: matcha-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    mem_limit: 2g

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matcha-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_URLS: http://+:8080
      DatabaseProvider: SqlServer
      SqlMode: Docker
      ConnectionStrings__SqlDocker: "Server=sqlserver,1433;Database=matchadb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=True"
      AppSettings__BaseUri: http://localhost:${BACKEND_PORT:-8080}
      AppSettings__FrontUri: http://localhost:${FRONTEND_PORT:-3000}
      SmtpSettings__SmtpServer: ${SMTP_SERVER:-smtp.gmail.com}
      SmtpSettings__Port: ${SMTP_PORT:-587}
      SmtpSettings__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      SmtpSettings__Email: ${SMTP_EMAIL:?Set SMTP_EMAIL in .env}
      SmtpSettings__Password: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: matcha-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started

  adminer:
    image: adminer:latest
    container_name: matcha-adminer
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
